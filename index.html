<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS-Files Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121216; color: #e0e0e6; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .card { background: #1c1c24; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); text-align: center; max-width: 850px; width: 100%; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #2d2d3f; }
        input, button { padding: 12px; font-size: 1rem; border-radius: 6px; border: none; margin: 8px 0; width: 100%; box-sizing: border-box; }
        input { background: #2d2d3f; color: #fff; text-align: center; }
        button { background-color: #c0392b; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #a93226; }
        .players-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin: 20px 0; }
        .player-card { background: #252533; border: 1px solid #3b3b4f; border-radius: 8px; padding: 12px; text-align: left; }
        .evidence-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin: 3px; font-weight: bold; }
        .ev-weapon { background-color: #761c19; color: #ff9f9b; } 
        .ev-clue { background-color: #1b4d3e; color: #9bffd9; } 
        .forensic-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 20px 0; }
        .tile { background: #2a2a3a; padding: 10px; border-radius: 6px; border: 1px solid #444; font-size: 0.9rem; text-align: left; }
        .tile-title { font-weight: bold; color: #f1c40f; margin-bottom: 5px; font-size: 0.85rem; }
        .tile-option { padding: 4px 8px; margin: 2px 0; border-radius: 4px; cursor: pointer; font-size: 0.8rem; background: #333; }
        .tile-option.selected { background: #27ae60 !important; color: white; font-weight: bold; }
        .role-badge { font-size: 1.4rem; font-weight: bold; padding: 10px 20px; border-radius: 6px; display: inline-block; margin-bottom: 15px; }
        .role-forensic { background: #2980b9; color: white; }
        .role-murderer { background: #c0392b; color: white; }
        .role-investigator { background: #27ae60; color: white; }
        .alert-box { background: rgba(231, 76, 60, 0.1); border: 1px solid #e74c3c; padding: 12px; border-radius: 6px; margin: 15px 0; color: #ff7675; font-weight: bold; text-align: left; }
    </style>
</head>
<body>

    <h1>🕵️‍♂️ CS-Files: Deception</h1>

    <div class="card" id="setup-screen">
        <h3>เข้าสู่กองพิสูจน์หลักฐาน (6-10 คน)</h3>
        <input type="text" id="room-input" placeholder="รหัสห้อง (เช่น 555)" maxlength="10">
        <input type="text" id="name-input" placeholder="ชื่อเล่นของคุณ" maxlength="15">
        <button id="join-btn">เข้าร่วมทีมสืบสวน</button>
    </div>

    <div class="card" id="lobby-screen" style="display: none;">
        <h3 id="room-display">ห้องหมายเลข: -</h3>
        <p style="color: #27ae60; font-weight: bold;">🔒 เชื่อมต่อผ่านระบบเรียบร้อยแล้ว</p>
        <p>กำลังรอนักสืบและผู้เชี่ยวชาญเข้าประจำการ...</p>
        <div id="player-list" style="text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 15px 0;"></div>
        <button id="start-btn" style="background-color: #27ae60; display: none;">เริ่มแจกแจงคดี!</button>
    </div>

    <div class="card" id="game-screen" style="display: none;">
        <div id="role-container"></div>
        <div id="secret-reveal" class="alert-box" style="display: none;"></div>

        <h3>📌 กระดานชันสูตรและบันทึกคดี</h3>
        <div id="forensic-display-board" class="forensic-board"></div>

        <h3>👥 หลักฐานทั้งหมดบนโต๊ะสืบสวน</h3>
        <div class="players-board" id="game-players-grid"></div>

        <button id="reset-btn" style="background-color: #7f8c8d; margin-top: 25px; width: auto; padding: 10px 30px;">รีเซ็ตเริ่มคดีใหม่</button>
    </div>

    <script>
        const BACKEND_URL = "https://cs-flies.vercel.app/api/game";

        let roomId = "";
        let myName = "";
        const forensicTiles = [
            { id: "location", title: "สถานที่เกิดเหตุ", options: ["บ้านพัก", "โรงแรม", "ผับ/บาร์", "ที่ทำงาน", "ที่สาธารณะ", "ยานพาหนะ"] },
            { id: "cause", title: "สาเหตุการตาย", options: ["ขาดอากาศ", "เสียเลือดมาก", "สารพิษ/ยาเกินขนาด", "บาดแผลถูกกระแทก", "อวัยวะล้มเหลว"] },
            { id: "body", title: "สภาพของศพ", options: ["เสื้อผ้าเรียบร้อย", "บิดเบี้ยวผิดธรรมชาติ", "นิ่งสงบเหมือนหลับ", "อุณหภูมิผิดปกติ", "มีร่องรอยการดิ้นรน"] },
            { id: "motive", title: "แรงจูงใจ", options: ["มรดก/เงินทอง", "ความแค้นชำระสะสาง", "ชู้สาว/ความรัก", "ป้องกันตัว", "ปิดปากพยาน"] }
        ];

        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]));
        }

        document.getElementById('join-btn').addEventListener('click', () => {
            callBackend('join');
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            callBackend('startGame');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            callBackend('resetGame');
        });

        async function callBackend(action, extraData = {}) {
            if (action === 'join') {
                roomId = escapeHTML(document.getElementById('room-input').value.trim()).substring(0, 10);
                myName = escapeHTML(document.getElementById('name-input').value.trim()).substring(0, 15);
                if(!roomId || !myName) return alert("กรุณากรอกข้อมูลให้ครบ!");
                
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('lobby-screen').style.display = 'block';
                document.getElementById('room-display').textContent = `คดีหมายเลขห้อง: ${roomId}`;
                
                setInterval(syncGame, 2000);
            }

            try {
                await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, roomId, playerName: myName, ...extraData })
                });
            } catch (e) { console.error("ระบบหลังบ้านขัดข้อง:", e); }
        }

        async function syncGame() {
            if (!roomId) return;
            try {
                const res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'getRoom', roomId })
                });
                const data = await res.json();
                
                if (!data || data.status === "none") return;

                if (data.status === "lobby") {
                    document.getElementById('lobby-screen').style.display = 'block';
                    document.getElementById('game-screen').style.display = 'none';
                    
                    const playerNames = data.players ? Object.keys(data.players) : [];
                    const startBtn = document.getElementById('start-btn');
                    
                    if (playerNames.length > 0 && playerNames[0] === myName) {
                        startBtn.style.display = 'block';
                    } else {
                        startBtn.style.display = 'none';
                    }

                    const listDiv = document.getElementById('player-list');
                    listDiv.innerHTML = "";
                    playerNames.forEach(p => {
                        const el = document.createElement('div');
                        el.style.padding = "6px 10px";
                        el.style.margin = "4px 0";
                        el.style.background = "rgba(255,255,255,0.05)";
                        el.style.borderRadius = "4px";
                        el.style.fontSize = "1.1rem";
                        
                        if (p === myName) {
                            el.textContent = `🕵️‍♂️ เจ้าหน้าที่: ${p} (ตัวคุณ)`;
                            el.style.color = "#f1c40f";
                        } else {
                            el.textContent = `🕵️‍♂️ เจ้าหน้าที่: ${p}`;
                        }
                        listDiv.appendChild(el);
                    });
                } else if (data.status === "playing") {
                    document.getElementById('lobby-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';
                    renderGame(data);
                }
            } catch (e) { console.error("ซิงค์เกมล้มเหลว:", e); }
        }

        function renderGame(data) {
            const roleContainer = document.getElementById('role-container');
            const secretReveal = document.getElementById('secret-reveal');
            const myData = data.players[myName];

            if (myData && myData.role) {
                let roleClass = "role-investigator";
                let roleText = "นักสืบ (Investigator)";
                if (data.forensic === myName) {
                    roleClass = "role-forensic";
                    roleText = "นักพิสูจน์หลักฐาน (Forensic Scientist)";
                } else if (myData.role === "murderer") {
                    roleClass = "role-murderer";
                    roleText = "ฆาตกร (Murderer)";
                }

                roleContainer.innerHTML = `<span class="role-badge ${roleClass}">บทบาทของคุณ: ${roleText}</span>`;
                
                if (myData.role === "murderer" && data.clue && data.weapon) {
                    secretReveal.style.display = "block";
                    secretReveal.innerHTML = `⚠️ หลักฐานที่คุณใช้ก่อคดี: <span class="evidence-tag ev-weapon">${data.weapon}</span> และ <span class="evidence-tag ev-clue">${data.clue}</span> (ห้ามให้ใครรู้!)`;
                } else if (data.forensic === myName && data.clue && data.weapon) {
                    secretReveal.style.display = "block";
                    secretReveal.innerHTML = `🔎 ข้อมูลคดีลับ: ฆาตกรใช้ <span class="evidence-tag ev-weapon">${data.weapon}</span> และ <span class="evidence-tag ev-clue">${data.clue}</span> ชี้เป้าให้ถูกตัว!`;
                } else {
                    secretReveal.style.display = "none";
                }
            }

            const forensicBoard = document.getElementById('forensic-display-board');
            forensicBoard.innerHTML = "";
            forensicTiles.forEach(tile => {
                const tileEl = document.createElement('div');
                tileEl.className = "tile";
                tileEl.innerHTML = `<div class="tile-title">${tile.title}</div>`;
                
                tile.options.forEach(opt => {
                    const optEl = document.createElement('div');
                    optEl.className = "tile-option";
                    optEl.textContent = opt;
                    
                    if (data.selections && data.selections[tile.id] === opt) {
                        optEl.classList.add('selected');
                    }

                    if (data.forensic === myName) {
                        optEl.addEventListener('click', () => {
                            callBackend('selectTile', { tileId: tile.id, option: opt });
                        });
                    }
                    tileEl.appendChild(optEl);
                });
                forensicBoard.appendChild(tileEl);
            });

            const playersGrid = document.getElementById('game-players-grid');
            playersGrid.innerHTML = "";
            Object.keys(data.players).forEach(p => {
                const pData = data.players[p];
                if (p === data.forensic) return;

                const pCard = document.createElement('div');
                pCard.className = "player-card";
                pCard.innerHTML = `<strong>${p}</strong> ${p === myName ? '(ตัวคุณ)' : ''}<br><div style="margin-top:5px;"></div>`;
                
                if (pData.weapons) {
                    pData.weapons.forEach(w => {
                        pCard.innerHTML += `<span class="evidence-tag ev-weapon">${w}</span>`;
                    });
                }
                if (pData.clues) {
                    pData.clues.forEach(c => {
                        pCard.innerHTML += `<span class="evidence-tag ev-clue">${c}</span>`;
                    });
                }
                playersGrid.appendChild(pCard);
            });
        }
    </script>
</body>
</html>
